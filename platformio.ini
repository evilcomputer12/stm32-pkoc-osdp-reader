[platformio]
default_envs = c8_reader_hsu

[env:usb_baseline]
platform = platformio/ststm32@20.0.0
platform_packages =
    platformio/framework-arduinoststm32@4.30000.0
    platformio/framework-cmsis@2.60300.0
    platformio/framework-cmsis-dsp@1.16.2
    platformio/toolchain-gccarmnoneeabi@1.120301.0
    platformio/tool-openocd@3.1200.7
board = genericSTM32F103C8
framework = arduino
extra_scripts = post:scripts/stlink_native.py
debug_server =
    /opt/homebrew/bin/openocd
    -f
    interface/stlink.cfg
    -c
    transport select hla_swd
    -f
    target/stm32f1x.cfg
    -c
    adapter speed 1000
build_src_filter = +<main.cpp> +<clock_hse8.cpp>
board_build.core = stm32
upload_protocol = stlink
debug_tool = stlink
debug_speed = 1000
monitor_speed = 115200
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC

; HSE verified by direct-HSE firmware: 3001 ticks over 3000 ms of host time.
; Project-local clock uses HSE 8 MHz -> PLL 72 MHz -> USB 48 MHz.

; STM32F103C8T6: use documented capacity, regardless of probe-reported size.
board_upload.maximum_size = 65536
board_upload.maximum_ram_size = 20480

[env:clock_probe]
extends = env:usb_baseline
build_flags =
board_build.f_cpu = 8000000L
build_src_filter = +<clock_probe.cpp>

[env:pd_plain]
extends = env:usb_baseline
extra_scripts =
    ${env:usb_baseline.extra_scripts}
    pre:scripts/build_dependencies.py
build_src_filter = +<reader_main.cpp> +<clock_hse8.cpp> +<osdp_adapter.cpp> +<feedback.cpp>
build_flags =
    ${env:usb_baseline.build_flags}
    -D READER_OSDP
    -D HAL_UART_MODULE_ONLY
    -D SERIAL_RX_BUFFER_SIZE=256
    -D OSDP_PD_BUF_LEN=256
    -D OSDP_STREAM_BUFFER_LEN=1440
    -flto
build_unflags = -std=gnu17

; Explicit C8 build names for the diagnostic and Secure Channel stages.
[env:c8_plain]
extends = env:pd_plain
board = genericSTM32F103C8
board_upload.maximum_size = 65536
board_upload.maximum_ram_size = 20480

[env:c8_secure]
extends = env:pd_secure
board = genericSTM32F103C8
board_upload.maximum_size = 65536
board_upload.maximum_ram_size = 20480

[env:c8_reader]
extends = env:c8_secure
custom_components = osdp,atecc,wolfcrypt,asymcred
build_src_filter = ${env:pd_secure.build_src_filter} +<nfc_adapter.cpp>
build_flags = ${env:pd_secure.build_flags} -D READER_NFC -D NFC_INTERFACE_I2C

[env:c8_peripherals]
extends = env:peripherals
board = genericSTM32F103C8
board_upload.maximum_size = 65536
board_upload.maximum_ram_size = 20480
build_flags = ${env:peripherals.build_flags} -D I2C_TIMEOUT_TICK=20

[env:c8_reader_soft]
extends = env:c8_reader
build_src_filter = ${env:c8_reader.build_src_filter} +<soft_i2c.cpp>
build_flags = ${env:c8_reader.build_flags} -D READER_SOFT_I2C

; Slow diagnostic for a bench without external I2C pull-up resistors.
; Input pull-ups + open-drain LOW, never push-pull HIGH.
[env:c8_reader_pullup]
extends = env:c8_reader_soft
build_flags = ${env:c8_reader_soft.build_flags} -D READER_I2C_WEAK_PULLUPS

; ATECC: I2C1 PB6/PB7. PN532: independent I2C2 PB10/PB11, both 100 kHz.
[env:c8_reader_split]
extends = env:c8_reader
build_flags = ${env:c8_reader.build_flags} -D READER_SPLIT_I2C

; ATECC I2C1 B6/B7, PN532 HSU USART3 B10 TX / B11 RX, switches OFF/OFF.
[env:c8_reader_hsu]
extends = env:c8_reader
build_src_filter = ${env:c8_reader.build_src_filter} +<pn532_uart.cpp>
build_flags = ${env:pd_secure.build_flags} -D READER_NFC -D READER_PN532_HSU -D READER_ADAFRUIT -D READER_BUZZER_ENABLED=1
lib_ignore = Seeed-PN532-I2C-reviewed
lib_deps =
    adafruit/Adafruit PN532@1.3.4
    adafruit/Adafruit BusIO@1.17.4

; Separate PN532 bus with slow internal-pull-up diagnostic; ATECC stays HAL I2C1.
[env:c8_reader_split_stream]
extends = env:c8_reader_split
build_src_filter = ${env:c8_reader_split.build_src_filter} +<soft_i2c.cpp>
build_flags = ${env:c8_reader_split.build_flags} -D READER_PN532_SOFT_I2C

; Historical diagnostic, for 3.3 V bus levels only.
[env:c8_reader_split_pullup]
extends = env:c8_reader_split_stream
build_flags = ${env:c8_reader_split_stream.build_flags} -D READER_I2C_WEAK_PULLUPS

; Unmodified Elechouse library comparison, NFC only, current B10/B11 wiring.
[env:c8_elechouse_probe]
extends = env:usb_baseline
extra_scripts =
    ${env:usb_baseline.extra_scripts}
    pre:scripts/build_elechouse_probe.py
build_src_filter = +<elechouse_probe.cpp> +<clock_hse8.cpp>
lib_ignore = Seeed-PN532-I2C-reviewed
build_flags = ${env:usb_baseline.build_flags} -D I2C_TIMEOUT_TICK=20 -flto

; Same physical wires as the I2C probe; PN532 switches must BOTH be OFF.
; PB10 TX -> PN532 SCL/RX, PB11 RX <- PN532 SDA/TX. NFC only.
[env:c8_elechouse_hsu_probe]
extends = env:c8_elechouse_probe
custom_elechouse_transport = hsu
build_flags = ${env:c8_elechouse_probe.build_flags} -D ELECHOUSE_PROBE_HSU -D SERIAL_RX_BUFFER_SIZE=256

; Official Adafruit UART startup comparison, NFC only; no reset pin wired.
[env:c8_adafruit_hsu_probe]
extends = env:usb_baseline
build_src_filter = +<adafruit_hsu_probe.cpp> +<clock_hse8.cpp>
lib_ignore = Seeed-PN532-I2C-reviewed
lib_deps =
    adafruit/Adafruit PN532@1.3.4
    adafruit/Adafruit BusIO@1.17.4
build_flags = ${env:usb_baseline.build_flags} -D SERIAL_RX_BUFFER_SIZE=256 -flto

; Original board retained only as an explicitly selected diagnostic target.
[env:c6_plain]
extends = env:pd_plain
board = genericSTM32F103C6
board_upload.maximum_size = 32768
board_upload.maximum_ram_size = 10240

[env:pd_secure]
extends = env:pd_plain
custom_components = osdp,atecc,wolfcrypt
build_src_filter = ${env:pd_plain.build_src_filter} +<atecc_adapter.cpp>
build_flags =
    ${env:pd_plain.build_flags}
    -D READER_SECURE
    -D WOLFSSL_USER_SETTINGS
    -D I2C_TIMEOUT_TICK=20
; Optimize the complete image for size, including the upstream C11 sources.
build_type = release

[env:peripherals]
extends = env:usb_baseline
extra_scripts =
    ${env:usb_baseline.extra_scripts}
    pre:scripts/build_dependencies.py
custom_components = atecc
build_src_filter = +<peripheral_main.cpp> +<clock_hse8.cpp> +<atecc_adapter.cpp>
build_flags =
    ${env:usb_baseline.build_flags}
    -D NFC_INTERFACE_I2C
    -D HAL_UART_MODULE_ONLY
    -flto
build_unflags = -std=gnu17
