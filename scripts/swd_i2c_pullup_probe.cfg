# Offline bench probe only. Temporarily enable PB6's weak input pull-up;
# never drive SCL push-pull. Restore both GPIO registers before resuming.
init
halt
set saved_crl [lindex [read_memory 0x40010c00 32 1] 0]
set saved_odr [lindex [read_memory 0x40010c0c 32 1] 0]
set probe_status [catch {
    echo [format "CRL=0x%08x ODR=0x%04x" $saved_crl $saved_odr]
    for {set i 0} {$i < 8} {incr i} {
        set pins [lindex [read_memory 0x40010c08 32 1] 0]
        echo [format "BEFORE SCL=%d SDA=%d" [expr {($pins >> 6) & 1}] [expr {($pins >> 7) & 1}]]
        sleep 20
    }
    write_memory 0x40010c10 32 {0x40}
    write_memory 0x40010c00 32 [list [expr {($saved_crl & ~0x0f000000) | 0x08000000}]]
    sleep 10
    for {set i 0} {$i < 8} {incr i} {
        set pins [lindex [read_memory 0x40010c08 32 1] 0]
        echo [format "WEAK_PULLUP SCL=%d SDA=%d" [expr {($pins >> 6) & 1}] [expr {($pins >> 7) & 1}]]
        sleep 20
    }
} probe_error]
write_memory 0x40010c0c 32 [list $saved_odr]
write_memory 0x40010c00 32 [list $saved_crl]
echo "GPIO state restored"
resume
if {$probe_status != 0} { echo "Probe error: $probe_error" }
shutdown
