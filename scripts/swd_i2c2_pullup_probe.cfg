# Offline only: release I2C2, sample PB10/PB11 floating then weak pull-up.
# Never drives either line HIGH. Restore peripheral and GPIO state.
init
halt
set old_cr1 [lindex [read_memory 0x40005800 32 1] 0]
set old_crh [lindex [read_memory 0x40010c04 32 1] 0]
set old_odr [lindex [read_memory 0x40010c0c 32 1] 0]
set probe_status [catch {
    write_memory 0x40005800 32 [list [expr {$old_cr1 & ~1}]]
    write_memory 0x40010c04 32 [list [expr {($old_crh & ~0xff00) | 0x4400}]]
    for {set i 0} {$i < 8} {incr i} {
        set pins [lindex [read_memory 0x40010c08 32 1] 0]
        echo [format "FLOAT SCL_B10=%d SDA_B11=%d" [expr {($pins >> 10) & 1}] [expr {($pins >> 11) & 1}]]
        sleep 20
    }
    write_memory 0x40010c10 32 {0xc00}
    write_memory 0x40010c04 32 [list [expr {($old_crh & ~0xff00) | 0x8800}]]
    sleep 10
    for {set i 0} {$i < 8} {incr i} {
        set pins [lindex [read_memory 0x40010c08 32 1] 0]
        echo [format "WEAK_PULLUP SCL_B10=%d SDA_B11=%d" [expr {($pins >> 10) & 1}] [expr {($pins >> 11) & 1}]]
        sleep 20
    }
} probe_error]
write_memory 0x40010c0c 32 [list $old_odr]
write_memory 0x40010c04 32 [list $old_crh]
write_memory 0x40005800 32 [list $old_cr1]
echo "I2C2/GPIO state restored"
resume
if {$probe_status != 0} { echo "Probe error: $probe_error" }
shutdown
