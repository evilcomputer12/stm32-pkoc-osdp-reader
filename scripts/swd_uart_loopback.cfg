# Run only with RO disconnected and a direct PA9-to-PA10 jumper installed.
# Temporarily drive PA9 at steady levels, observe both pins, then restore.
init
halt
set old_cr1 [lindex [read_memory 0x4001380c 32 1] 0]
set old_crh [lindex [read_memory 0x40010804 32 1] 0]
set old_odr [lindex [read_memory 0x4001080c 32 1] 0]
set probe_status [catch {
    write_memory 0x4001380c 32 {0}
    set gpio_crh [expr {($old_crh & ~0xf0) | 0x10}]
    write_memory 0x40010804 32 [list $gpio_crh]
    echo [format "CRH before=0x%08x requested=0x%08x readback=0x%08x" $old_crh $gpio_crh [lindex [read_memory 0x40010804 32 1] 0]]
    echo [format "USART CR1 readback=0x%08x GPIO LCKR=0x%08x" [lindex [read_memory 0x4001380c 32 1] 0] [lindex [read_memory 0x40010818 32 1] 0]]
    for {set i 0} {$i < 4} {incr i} {
        write_memory 0x40010810 32 {0x02000000}
        sleep 20
        set low [lindex [read_memory 0x40010808 32 1] 0]
        echo [format "PA9 driven LOW:  PA9=%d PA10=%d IDR=0x%04x ODR=0x%04x" [expr {($low >> 9) & 1}] [expr {($low >> 10) & 1}] $low [lindex [read_memory 0x4001080c 32 1] 0]]
        write_memory 0x40010810 32 {0x00000200}
        sleep 20
        set high [lindex [read_memory 0x40010808 32 1] 0]
        echo [format "PA9 driven HIGH: PA9=%d PA10=%d IDR=0x%04x ODR=0x%04x" [expr {($high >> 9) & 1}] [expr {($high >> 10) & 1}] $high [lindex [read_memory 0x4001080c 32 1] 0]]
    }
} probe_error]
write_memory 0x4001080c 32 [list $old_odr]
write_memory 0x40010804 32 [list $old_crh]
write_memory 0x4001380c 32 [list $old_cr1]
resume
if {$probe_status != 0} { echo "GPIO probe error: $probe_error" }
shutdown
